name: Build and Package WebOBS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Package Release
      run: |
        mkdir -p package_output
        cp app/build/outputs/apk/debug/app-debug.apk package_output/WebOBS-v3.1-PRO.apk

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v3.1-pro-${{ github.run_number }}"
        name: "WebOBS Studio v3.1 PRO (Build #${{ github.run_number }})"
        body: "Perbaikan: Video sinkron bergerak di Program (tidak freeze), 8-point bounding box, media toolbar play/pause/seekbar aktif, Studio Mode stabil."
        files: package_output/WebOBS-v3.1-PRO.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
