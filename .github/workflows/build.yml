name: Build and Package WebOBS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Package Release ZIP
      run: |
        mkdir -p package_output
        cp app/build/outputs/apk/debug/app-debug.apk package_output/WebOBS.apk
        cd package_output
        zip -9 WebOBS-Studio-v1.2.zip WebOBS.apk
        cd ..

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.2
        name: "WebOBS Studio v1.2 Release"
        body: "WebOBS Studio standalone build. Mengaktifkan izin kamera/mic otomatis, logo OBS Studio, dan paket ZIP."
        files: |
          package_output/WebOBS-Studio-v1.2.zip
          package_output/WebOBS.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
