name: Build and Package WebOBS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Package Release
      run: |
        mkdir -p package_output
        cp app/build/outputs/apk/debug/app-debug.apk package_output/WebOBS-V8-LIVE-OK.apk

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v8.0-live-ok"
        name: "WebOBS Studio v8.0 LIVE OK"
        body: "Engine streaming diperbarui ke TCP localhost non-blocking buffer untuk Facebook Live."
        files: package_output/WebOBS-V8-LIVE-OK.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
