name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: |
          gradle wrapper
          ./gradlew assembleDebug --no-daemon
          APK_PATH=$(find . -name "*.apk" -type f | head -n 1)
          echo "Ditemukan APK: $APK_PATH"
          mkdir -p release_apk
          cp "$APK_PATH" release_apk/WebOBS.apk
          ls -lh release_apk/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0
          name: "WebOBS v1.0"
          files: release_apk/WebOBS.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
