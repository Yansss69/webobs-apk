name: Build and Package WebOBS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Package Release
      run: |
        mkdir -p package_output
        cp app/build/outputs/apk/debug/app-debug.apk package_output/WebOBS-v7-CLEAN.apk

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v7.0-clean-1791038153"
        name: "WebOBS Studio v7.0 CLEAN"
        body: "Build segar perbaikan antarmuka responsif dan aktifasi studio mode."
        files: package_output/WebOBS-v7-CLEAN.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
