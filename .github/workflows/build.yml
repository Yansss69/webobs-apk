name: Build and Package WebOBS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Package Release ZIP
      run: |
        sudo apt-get update && sudo apt-get install -y zip
        mkdir -p package_output
        cp app/build/outputs/apk/debug/app-debug.apk package_output/WebOBS.apk
        cd package_output
        zip -9 WebOBS-v2.0-ULTIMATE.zip WebOBS.apk
        cd ..

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v2.0-ultimate-${{ github.run_number }}"
        name: "WebOBS Studio v2.0 ULTIMATE (Build #${{ github.run_number }})"
        body: "WebOBS Studio v2.0 ULTIMATE: Galeri Foto/Video, Grid Merah Drag & Scale, Dual Monitor Studio Mode, Mic dB Meter."
        files: |
          package_output/WebOBS-v2.0-ULTIMATE.zip
          package_output/WebOBS.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
