<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web OBS - Live Controller</title>
    <style>
        body { background-color: #1a1a2e; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; padding: 20px; }
        .header { margin-bottom: 20px; }
        
        /* Desain Kotak Monitor */
        .monitor-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .monitor-box { background-color: #16213e; border: 2px solid #0f3460; border-radius: 10px; padding: 10px; width: 45%; min-width: 300px; }
        .monitor-box h3 { margin: 0 0 10px 0; font-size: 16px; color: #e94560; }
        
        /* Iframe untuk memanggil WebRTC MediaMTX */
        iframe { width: 100%; height: 250px; background-color: black; border: none; border-radius: 5px; }
        
        /* Desain Panel Tombol */
        .kontrol-panel { background-color: #0f3460; padding: 20px; border-radius: 10px; margin-top: 30px; display: inline-block; }
        button { padding: 12px 25px; margin: 5px; font-size: 16px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.8; }
        .btn-start { background-color: #e74c3c; color: white; }
        .btn-stop { background-color: #7f8c8d; color: white; }
        
        #status-teks { margin-top: 15px; font-weight: bold; color: #aaa; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎛️ Web OBS Controller</h1>
        <p>Kontrol Live Streaming Facebook dari Browser</p>
    </div>
    
    <!-- Layar Preview Monitor (Mengambil dari WebRTC MediaMTX Port 8889) -->
    <div class="monitor-container">
        <div class="monitor-box">
            <h3>Preview Kamera 1 (Drone)</h3>
            <iframe src="http://localhost:8889/kamera1/" allow="autoplay; fullscreen"></iframe>
        </div>
        <div class="monitor-box">
            <h3>Preview Kamera 2 (Kamera HP)</h3>
            <iframe src="http://localhost:8889/kamera2/" allow="autoplay; fullscreen"></iframe>
        </div>
    </div>

    <!-- Panel Tombol Eksekusi -->
    <div class="kontrol-panel">
        <button class="btn-start" onclick="startLive()">🔴 MULAI LIVE FACEBOOK</button>
        <button class="btn-stop" onclick="stopLive()">⏹️ STOP LIVE</button>
        <div id="status-teks">Status: Menunggu Perintah...</div>
    </div>

    <script>
        function startLive() {
            document.getElementById('status-teks').innerText = "Status: 🔴 SEDANG LIVE DI FACEBOOK!";
            document.getElementById('status-teks').style.color = "#e74c3c";
            
            fetch('/api/start-live')
                .then(res => res.json())
                .then(data => console.log(data.status));
        }

        function stopLive() {
            document.getElementById('status-teks').innerText = "Status: ⏹️ Live Dihentikan.";
            document.getElementById('status-teks').style.color = "#aaa";
            
            fetch('/api/stop-live')
                .then(res => res.json())
                .then(data => console.log(data.status));
        }
    </script>
</body>
</html>
