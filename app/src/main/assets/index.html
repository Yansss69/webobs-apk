<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OBS Studio Native Mobile</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
    html, body {
      width: 100vw; height: 100vh; overflow: hidden;
      background: #14151b; color: #dcddde;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px; user-select: none;
    }
    #obs-root { display: flex; flex-direction: column; width: 100vw; height: 100vh; }

    /* Top Menu Bar OBS */
    .obs-menubar {
      height: 24px; background: #1f202b; border-bottom: 1px solid #2d2f3d;
      display: flex; align-items: center; padding: 0 8px; gap: 12px; font-size: 11px; flex-shrink: 0;
    }
    .obs-menu-item { color: #b9bbbe; cursor: pointer; }
    .obs-menu-item:hover { color: #fff; }

    /* Area Viewport Monitor */
    .obs-stage-wrap {
      flex: 1; display: flex; flex-direction: column; background: #0c0d12;
      padding: 4px; gap: 4px; overflow: hidden; position: relative;
    }
    .obs-monitors-container {
      flex: 1; display: flex; width: 100%; height: 100%; gap: 6px;
      justify-content: center; align-items: center; position: relative;
    }

    /* Kotak Monitor OBS (Auto Aspect-Ratio 16:9 Anti Gepeng) */
    .obs-monitor {
      height: 100%; display: flex; flex-direction: column;
      background: #000; border: 1px solid #2d2f3d; position: relative;
      aspect-ratio: 16 / 9; max-width: 100%; overflow: hidden;
    }
    .obs-monitor.preview-border { border-color: #2563eb; }
    .obs-monitor.program-border { border-color: #dc2626; }

    .obs-monitor-title {
      height: 18px; font-size: 9px; font-weight: bold; letter-spacing: 0.8px;
      display: flex; align-items: center; justify-content: space-between; padding: 0 6px; flex-shrink: 0;
    }
    .title-preview { background: #1e3a8a; color: #bfdbfe; }
    .title-program { background: #7f1d1d; color: #fecaca; }

    .obs-canvas-box {
      flex: 1; position: relative; overflow: hidden; background: #000;
      width: 100%; height: 100%;
    }
    canvas.obs-display {
      width: 100%; height: 100%; display: block; object-fit: contain; background: #000;
    }

    /* OBS 8-Point Bounding Box Merah Presisi */
    .obs-bbox {
      position: absolute; border: 2px solid #ef4444; touch-action: none;
      box-sizing: border-box; pointer-events: all; z-index: 10;
    }
    .obs-handle {
      position: absolute; width: 10px; height: 10px; background: #ffffff;
      border: 2px solid #ef4444; border-radius: 2px; box-sizing: border-box;
    }
    .h-tl { left: -5px; top: -5px; }
    .h-tr { right: -5px; top: -5px; }
    .h-bl { left: -5px; bottom: -5px; }
    .h-br { right: -5px; bottom: -5px; }
    .h-tm { left: calc(50% - 5px); top: -5px; }
    .h-bm { left: calc(50% - 5px); bottom: -5px; }
    .h-ml { left: -5px; top: calc(50% - 5px); }
    .h-mr { right: -5px; top: calc(50% - 5px); }

    /* Studio Mode Center Transition Bar */
    .obs-trans-bar {
      width: 72px; display: none; flex-direction: column; justify-content: center;
      gap: 6px; align-items: center; flex-shrink: 0;
    }
    .obs-btn-trans {
      width: 100%; background: #282a38; border: 1px solid #3c3f52; color: #fff;
      font-size: 10px; font-weight: bold; padding: 7px 2px; border-radius: 3px; cursor: pointer;
    }
    .obs-btn-trans.active-t { background: #2563eb; border-color: #3b82f6; }

    /* Media Playback Controls Toolbar */
    .obs-media-bar {
      height: 24px; background: #161720; border: 1px solid #2d2f3d; border-radius: 3px;
      display: none; align-items: center; padding: 0 8px; gap: 8px; flex-shrink: 0;
    }
    .obs-media-btn { background: none; border: none; color: #dcddde; cursor: pointer; font-size: 11px; }
    .obs-seekbar { flex: 1; height: 4px; accent-color: #5865f2; cursor: pointer; }
    .obs-media-time { font-family: monospace; font-size: 10px; color: #8e9297; }

    /* Bottom Docks OBS */
    .obs-docks {
      height: 135px; background: #1a1b24; border-top: 1px solid #2d2f3d;
      display: flex; flex-shrink: 0;
    }
    .obs-dock-panel {
      border-right: 1px solid #2d2f3d; display: flex; flex-direction: column; position: relative;
    }
    .obs-dock-header {
      height: 20px; font-size: 9px; font-weight: bold; text-transform: uppercase;
      background: #14151e; color: #8e9297; padding: 0 8px; display: flex;
      align-items: center; justify-content: space-between; border-bottom: 1px solid #262836;
    }
    .obs-dock-content {
      flex: 1; overflow-y: auto; padding: 3px; display: flex; flex-direction: column; gap: 2px;
    }
    .obs-dock-footer {
      height: 26px; background: #14151e; border-top: 1px solid #262836;
      display: flex; align-items: center; padding: 0 4px; gap: 3px;
    }
    .obs-dock-btn {
      background: #282a3a; border: 1px solid #3c3f54; color: #dcddde;
      min-width: 22px; height: 20px; font-size: 11px; border-radius: 3px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .obs-dock-btn:active { background: #5865f2; color: #fff; }

    .obs-item-row {
      padding: 4px 6px; font-size: 11px; border-radius: 2px; background: #232533;
      color: #dcddde; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
    }
    .obs-item-row.selected { background: #5865f2; color: #fff; font-weight: 500; }

    /* Audio Mixer Dock */
    .mixer-channel { display: flex; flex-direction: column; gap: 4px; padding: 8px; width: 100%; }
    .mixer-label-row { display: flex; justify-content: space-between; font-size: 10px; font-weight: bold; }
    .obs-vu-track {
      width: 100%; height: 8px; background: #12131a; border-radius: 2px;
      position: relative; overflow: hidden; border: 1px solid #2a2c3a;
    }
    .obs-vu-fill {
      height: 100%; width: 0%;
      background: linear-gradient(to right, #22c55e 0%, #22c55e 70%, #eab308 85%, #ef4444 100%);
      transition: width 0.05s ease-out;
    }
    .obs-fader { width: 100%; accent-color: #5865f2; cursor: pointer; height: 14px; }

    /* Controls Panel */
    .controls-panel { width: 135px; padding: 5px; display: flex; flex-direction: column; gap: 3px; border-right: none; }
    .obs-ctrl-btn {
      flex: 1; background: #282a3a; border: 1px solid #3a3d52; color: #dcddde;
      border-radius: 3px; font-size: 10px; font-weight: 500; cursor: pointer;
    }
    .obs-ctrl-btn:active { background: #3e4258; }
    .obs-live-on { background: #dc2626 !important; color: #fff !important; font-weight: bold; }
    .obs-rec-on { background: #dc2626 !important; color: #fff !important; font-weight: bold; }

    /* Status Bar */
    .obs-statusbar {
      height: 20px; background: #101117; border-top: 1px solid #1f202b;
      display: flex; align-items: center; padding: 0 10px; font-size: 10px; color: #72767d; gap: 16px; flex-shrink: 0;
    }

    /* Modal System */
    .obs-modal-mask {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85); z-index: 99999; align-items: center; justify-content: center;
    }
    .obs-dialog {
      background: #20212b; border: 1px solid #303242; border-radius: 6px;
      width: 350px; max-height: 85vh; overflow-y: auto; padding: 12px; color: #dcddde;
    }
    .obs-dialog-head {
      font-size: 12px; font-weight: bold; border-bottom: 1px solid #303242;
      padding-bottom: 6px; margin-bottom: 10px; display: flex; justify-content: space-between;
    }
    .obs-dlg-btn {
      width: 100%; background: #292b3b; border: 1px solid #3d4158; color: #fff;
      padding: 8px 10px; border-radius: 4px; text-align: left; font-size: 11px;
      margin-bottom: 5px; cursor: pointer;
    }
    .obs-dlg-btn:active { background: #5865f2; }
    .obs-field { margin-bottom: 8px; display: flex; flex-direction: column; gap: 3px; }
    .obs-field label { font-size: 10px; color: #8e9297; text-transform: uppercase; }
    .obs-field input, .obs-field select {
      background: #14151c; border: 1px solid #303242; color: #fff; padding: 6px;
      border-radius: 3px; font-size: 11px;
    }
  </style>
</head>
<body>
<div id="obs-root">
  <!-- Topbar Menu -->
  <div class="obs-menubar">
    <span class="obs-menu-item">File</span>
    <span class="obs-menu-item">Edit</span>
    <span class="obs-menu-item">View</span>
    <span class="obs-menu-item">Profile</span>
    <span class="obs-menu-item">Scene Collection</span>
    <span class="obs-menu-item">Tools</span>
    <span class="obs-menu-item">Help</span>
  </div>

  <!-- Viewport Area -->
  <div class="obs-stage-wrap">
    <div class="obs-monitors-container" id="monitorsContainer">
      <!-- Preview Monitor (16:9 Proporsional Asli) -->
      <div class="obs-monitor preview-border" id="previewMonitor">
        <div class="obs-monitor-title title-preview" id="previewHeader"><span>PREVIEW</span><span>WORKSPACE</span></div>
        <div class="obs-canvas-box" id="previewStageBox">
          <canvas class="obs-display" id="previewCanvas" width="1280" height="720"></canvas>
          <div id="previewInteractiveOverlay" style="position:absolute; width:100%; height:100%; top:0; left:0; pointer-events:none;"></div>
        </div>
      </div>

      <!-- Transition Controls Bar -->
      <div class="obs-trans-bar" id="transBar">
        <button class="obs-btn-trans" onclick="execTransition('cut')">CUT</button>
        <button class="obs-btn-trans active-t" onclick="execTransition('fade')">TRANSITION</button>
      </div>

      <!-- Program Monitor -->
      <div class="obs-monitor program-border" id="programMonitor" style="display:none;">
        <div class="obs-monitor-title title-program"><span>PROGRAM</span><span>LIVE ON AIR</span></div>
        <div class="obs-canvas-box">
          <canvas class="obs-display" id="programCanvas" width="1280" height="720"></canvas>
        </div>
      </div>
    </div>

    <!-- Media Controls Toolbar -->
    <div class="obs-media-bar" id="mediaToolbar">
      <button class="obs-media-btn" id="mPlayBtn" onclick="togglePlayMedia()">⏸</button>
      <button class="obs-media-btn" onclick="stopMedia()">⏹</button>
      <button class="obs-media-btn" onclick="restartMedia()">⏮</button>
      <input type="range" class="obs-seekbar" id="mSeekbar" min="0" max="100" value="0" oninput="onSeekMedia(this.value)">
      <span class="obs-media-time" id="mTimeLabel">00:00:00 / 00:00:00</span>
    </div>
  </div>

  <!-- Bottom Docks -->
  <div class="obs-docks">
    <!-- Scenes Dock -->
    <div class="obs-dock-panel" style="width: 140px;">
      <div class="obs-dock-header">Scenes</div>
      <div class="obs-dock-content" id="scenesDockList"></div>
      <div class="obs-dock-footer">
        <button class="obs-dock-btn" onclick="addScenePrompt()">+</button>
        <button class="obs-dock-btn" onclick="removeScene()">-</button>
        <button class="obs-dock-btn" onclick="renameScenePrompt()">✎</button>
      </div>
    </div>

    <!-- Sources Dock -->
    <div class="obs-dock-panel" style="width: 180px;">
      <div class="obs-dock-header">Sources</div>
      <div class="obs-dock-content" id="sourcesDockList"></div>
      <div class="obs-dock-footer">
        <button class="obs-dock-btn" onclick="openAddSourceModal()">+</button>
        <button class="obs-dock-btn" onclick="removeActiveSource()">-</button>
        <button class="obs-dock-btn" onclick="moveLayerUp()">▲</button>
        <button class="obs-dock-btn" onclick="moveLayerDown()">▼</button>
      </div>
    </div>

    <!-- Audio Mixer Dock -->
    <div class="obs-dock-panel" style="flex: 1;">
      <div class="obs-dock-header"><span>Audio Mixer</span><span style="color:#22c55e; font-size:8px;">● LIVE</span></div>
      <div class="obs-dock-content">
        <div class="mixer-channel">
          <div class="mixer-label-row">
            <span>Mic/Aux</span>
            <span id="dbNumLabel" style="color:#22c55e;">-inf dB</span>
          </div>
          <div class="obs-vu-track">
            <div class="obs-vu-fill" id="vuMeterBar"></div>
          </div>
          <input type="range" class="obs-fader" id="volFader" min="0" max="100" value="85" oninput="setMicVolume(this.value)">
        </div>
      </div>
    </div>

    <!-- Scene Transitions Dock -->
    <div class="obs-dock-panel" style="width: 120px;">
      <div class="obs-dock-header">Transitions</div>
      <div style="padding: 8px; display:flex; flex-direction:column; gap:5px;">
        <select style="background:#14151c; border:1px solid #303242; color:#fff; font-size:10px; padding:3px;" id="transType">
          <option value="fade">Fade</option>
          <option value="cut">Cut</option>
        </select>
        <input type="text" value="300 ms" style="background:#14151c; border:1px solid #303242; color:#fff; font-size:10px; padding:3px;" />
      </div>
    </div>

    <!-- Controls Dock -->
    <div class="obs-dock-panel controls-panel">
      <button class="obs-ctrl-btn" id="btnStream" onclick="toggleStream()">Start Streaming</button>
      <button class="obs-ctrl-btn" id="btnRecord" onclick="toggleRecord()">Start Recording</button>
      <button class="obs-ctrl-btn" id="btnStudio" onclick="toggleStudioMode()">Studio Mode</button>
      <button class="obs-ctrl-btn" onclick="openSettingsModal()">Settings</button>
    </div>
  </div>

  <!-- Status Bar -->
  <div class="obs-statusbar">
    <div class="status-badge"><span id="lblLive">● LIVE: 00:00:00</span></div>
    <div class="status-badge"><span id="lblRec">● REC: 00:00:00</span></div>
    <span>CPU: 0.0%, 60.00 fps</span>
    <span id="lblKbit">Kbit/s: 0</span>
  </div>
</div>

<!-- Input File Galeri -->
<input type="file" id="pickImgFile" accept="image/*" style="display:none;" onchange="onFileImgSelected(event)" />
<input type="file" id="pickVidFile" accept="video/*" style="display:none;" onchange="onFileVidSelected(event)" />

<!-- Modal Sources -->
<div id="sourceModal" class="obs-modal-mask">
  <div class="obs-dialog">
    <div class="obs-dialog-head">
      <span>Add Source</span>
      <span style="cursor:pointer;" onclick="closeModal('sourceModal')">✕</span>
    </div>
    <button class="obs-dlg-btn" onclick="triggerPick('image')">🖼️ Image (Galeri Foto)</button>
    <button class="obs-dlg-btn" onclick="triggerPick('video')">🎬 Media Source (Galeri Video)</button>
    <button class="obs-dlg-btn" onclick="initCamDevice('environment')">📹 Video Capture (Kamera Belakang)</button>
    <button class="obs-dlg-btn" onclick="initCamDevice('user')">🤳 Video Capture (Kamera Depan)</button>
    <button class="obs-dlg-btn" onclick="addDroneStream()">🛸 Drone / IP Stream (RTSP / RTMP)</button>
    <button class="obs-dlg-btn" onclick="addTextGDI()">📝 Text (GDI+ Overlay)</button>
    <button class="obs-dlg-btn" onclick="addColorBg()">⬛ Color Source</button>
  </div>
</div>

<!-- Modal Settings -->
<div id="settingsModal" class="obs-modal-mask">
  <div class="obs-dialog">
    <div class="obs-dialog-head">
      <span>OBS Settings</span>
      <span style="cursor:pointer;" onclick="closeModal('settingsModal')">✕</span>
    </div>
    <div class="obs-field">
      <label>Platform / Service</label>
      <select id="cfgService">
        <option>Facebook Live</option>
        <option>Custom RTMP</option>
        <option>YouTube Live</option>
      </select>
    </div>
    <div class="obs-field">
      <label>Server URL</label>
      <input type="text" id="cfgServer" value="rtmps://live-api-s.facebook.com:443/rtmp/" />
    </div>
    <div class="obs-field">
      <label>Stream Key</label>
      <input type="password" id="cfgKey" placeholder="Paste Stream Key FB..." />
    </div>
    <div style="display:flex; gap:8px;">
      <div class="obs-field" style="flex:1;">
        <label>Video Bitrate</label>
        <input type="text" id="cfgBitrate" value="3500k" />
      </div>
      <div class="obs-field" style="flex:1;">
        <label>FPS</label>
        <select id="cfgFps"><option>30 FPS</option><option>60 FPS</option></select>
      </div>
    </div>
    <button class="obs-dlg-btn" style="background:#5865f2; text-align:center; font-weight:bold; margin-top:8px;" onclick="saveSettings()">Apply & OK</button>
  </div>
</div>

<script>
  /* ============================================================
     OBS STUDIO CORE PIPELINE & RENDER ENGINE (60 FPS CANVAS LOOP)
     ============================================================ */
  const pCanvas = document.getElementById("previewCanvas");
  const pCtx = pCanvas.getContext("2d");
  const gCanvas = document.getElementById("programCanvas");
  const gCtx = gCanvas.getContext("2d");

  let isStudioMode = false;
  let isStreaming = false;
  let isRecording = false;
  let liveSeconds = 0, recSeconds = 0;
  let liveTimer = null, recTimer = null;

  let currentSceneName = "Scene 1";
  let scenes = {
    "Scene 1": []
  };

  let programSceneSources = [];
  let activeSource = null;
  let micVolume = 0.85;

  function closeModal(id) { document.getElementById(id).style.display = "none"; }
  function openAddSourceModal() { document.getElementById("sourceModal").style.display = "flex"; }
  function openSettingsModal() {
    document.getElementById("cfgKey").value = localStorage.getItem("obs_key") || "";
    document.getElementById("cfgServer").value = localStorage.getItem("obs_server") || "rtmps://live-api-s.facebook.com:443/rtmp/";
    document.getElementById("settingsModal").style.display = "flex";
  }
  function saveSettings() {
    localStorage.setItem("obs_key", document.getElementById("cfgKey").value);
    localStorage.setItem("obs_server", document.getElementById("cfgServer").value);
    closeModal("settingsModal");
  }

  /* ------------------------------------------------------------
     60 FPS Master Render Loop
     ------------------------------------------------------------ */
  function renderSceneToCanvas(ctx, sourceList) {
    ctx.fillStyle = "#000000";
    ctx.fillRect(0, 0, 1280, 720);

    for (let src of sourceList) {
      if (!src.visible) continue;

      if (src.type === "image" || src.type === "video" || src.type === "camera") {
        if (src.element && (src.element.videoWidth || src.element.naturalWidth)) {
          ctx.drawImage(src.element, src.x, src.y, src.w, src.h);
        }
      } else if (src.type === "color") {
        ctx.fillStyle = src.color || "#2563eb";
        ctx.fillRect(src.x, src.y, src.w, src.h);
      } else if (src.type === "text") {
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold " + Math.max(16, src.h * 0.6) + "px sans-serif";
        ctx.textBaseline = "middle";
        ctx.fillText(src.text, src.x + 8, src.y + (src.h / 2));
      } else if (src.type === "drone") {
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(src.x, src.y, src.w, src.h);
        ctx.fillStyle = "#38bdf8";
        ctx.font = "bold 24px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("🛸 DRONE STREAM: " + src.name, src.x + (src.w / 2), src.y + (src.h / 2));
        ctx.textAlign = "left";
      }
    }
  }

  function masterEngineLoop() {
    renderSceneToCanvas(pCtx, scenes[currentSceneName] || []);

    if (isStudioMode) {
      renderSceneToCanvas(gCtx, programSceneSources);
    } else {
      renderSceneToCanvas(gCtx, scenes[currentSceneName] || []);
    }

    updateBBoxOverlay();
    requestAnimationFrame(masterEngineLoop);
  }
  requestAnimationFrame(masterEngineLoop);

  /* ------------------------------------------------------------
     8-Point Bounding Box Presisi (Rasio Nyata Kanvas 1280x720)
     ------------------------------------------------------------ */
  const overlay = document.getElementById("previewInteractiveOverlay");
  let bboxEl = null;

  function createBBoxDOM() {
    bboxEl = document.createElement("div");
    bboxEl.className = "obs-bbox";
    const handles = ["tl", "tr", "bl", "br", "tm", "bm", "ml", "mr"];
    handles.forEach(h => {
      const point = document.createElement("div");
      point.className = "obs-handle h-" + h;
      point.dataset.h = h;
      bboxEl.appendChild(point);
    });
    overlay.appendChild(bboxEl);
    setupBBoxEvents(bboxEl);
  }
  createBBoxDOM();

  function updateBBoxOverlay() {
    if (!activeSource || !activeSource.visible) {
      bboxEl.style.display = "none";
      return;
    }
    bboxEl.style.display = "block";

    // Hitung faktor skala kanvas secara akurat sesuai ukuran layar aktual
    const cw = pCanvas.clientWidth;
    const ch = pCanvas.clientHeight;
    const scaleX = cw / 1280;
    const scaleY = ch / 720;

    bboxEl.style.left = (pCanvas.offsetLeft + (activeSource.x * scaleX)) + "px";
    bboxEl.style.top = (pCanvas.offsetTop + (activeSource.y * scaleY)) + "px";
    bboxEl.style.width = (activeSource.w * scaleX) + "px";
    bboxEl.style.height = (activeSource.h * scaleY) + "px";
  }

  function setupBBoxEvents(el) {
    let mode = null;
    let sx, sy, initX, initY, initW, initH;

    function onPointerDown(e) {
      e.stopPropagation();
      const p = e.touches ? e.touches[0] : e;
      sx = p.clientX;
      sy = p.clientY;
      initX = activeSource.x;
      initY = activeSource.y;
      initW = activeSource.w;
      initH = activeSource.h;

      if (e.target.classList.contains("obs-handle")) {
        mode = e.target.dataset.h;
      } else {
        mode = "drag";
      }
    }

    function onPointerMove(e) {
      if (!mode || !activeSource) return;
      const p = e.touches ? e.touches[0] : e;
      const cw = pCanvas.clientWidth;
      const ch = pCanvas.clientHeight;
      const scaleX = 1280 / cw;
      const scaleY = 720 / ch;

      const dx = (p.clientX - sx) * scaleX;
      const dy = (p.clientY - sy) * scaleY;

      if (mode === "drag") {
        activeSource.x = Math.max(0, Math.min(1280 - activeSource.w, initX + dx));
        activeSource.y = Math.max(0, Math.min(720 - activeSource.h, initY + dy));
      } else {
        if (mode === "br") {
          activeSource.w = Math.max(50, initW + dx);
          activeSource.h = Math.max(30, initH + dy);
        } else if (mode === "bl") {
          activeSource.x = initX + dx;
          activeSource.w = Math.max(50, initW - dx);
          activeSource.h = Math.max(30, initH + dy);
        } else if (mode === "tr") {
          activeSource.y = initY + dy;
          activeSource.w = Math.max(50, initW + dx);
          activeSource.h = Math.max(30, initH - dy);
        } else if (mode === "tl") {
          activeSource.x = initX + dx;
          activeSource.y = initY + dy;
          activeSource.w = Math.max(50, initW - dx);
          activeSource.h = Math.max(30, initH - dy);
        } else if (mode === "mr") {
          activeSource.w = Math.max(50, initW + dx);
        } else if (mode === "bm") {
          activeSource.h = Math.max(30, initH + dy);
        } else if (mode === "tm") {
          activeSource.y = initY + dy;
          activeSource.h = Math.max(30, initH - dy);
        } else if (mode === "ml") {
          activeSource.x = initX + dx;
          activeSource.w = Math.max(50, initW - dx);
        }
      }
    }

    function onPointerUp() { mode = null; }

    el.addEventListener("mousedown", onPointerDown);
    el.addEventListener("touchstart", onPointerDown, { passive: false });
    window.addEventListener("mousemove", onPointerMove);
    window.addEventListener("touchmove", onPointerMove, { passive: false });
    window.addEventListener("mouseup", onPointerUp);
    window.addEventListener("touchend", onPointerUp);
  }

  /* ------------------------------------------------------------
     Scenes & Sources Dock Logic
     ------------------------------------------------------------ */
  function renderScenesUI() {
    const list = document.getElementById("scenesDockList");
    list.innerHTML = "";
    Object.keys(scenes).forEach(name => {
      const row = document.createElement("div");
      row.className = "obs-item-row" + (name === currentSceneName ? " selected" : "");
      row.innerText = name;
      row.onclick = () => switchScene(name);
      list.appendChild(row);
    });
  }

  function renderSourcesUI() {
    const list = document.getElementById("sourcesDockList");
    list.innerHTML = "";
    const arr = scenes[currentSceneName] || [];

    for (let i = arr.length - 1; i >= 0; i--) {
      const src = arr[i];
      const row = document.createElement("div");
      row.className = "obs-item-row" + (src === activeSource ? " selected" : "");
      row.innerHTML = `<span>${src.name}</span><span style="font-size:10px;">${src.visible ? '👁️' : '🚫'}</span>`;
      row.onclick = () => selectSource(src);
      list.appendChild(row);
    }
  }

  function selectSource(src) {
    activeSource = src;
    renderSourcesUI();
    if (src && src.type === "video") {
      showMediaToolbar(src.element);
    } else {
      hideMediaToolbar();
    }
  }

  function switchScene(name) {
    currentSceneName = name;
    activeSource = null;
    hideMediaToolbar();
    renderScenesUI();
    renderSourcesUI();
  }

  function addScenePrompt() {
    const name = prompt("Scene Name:", "Scene " + (Object.keys(scenes).length + 1));
    if (name && !scenes[name]) {
      scenes[name] = [];
      switchScene(name);
    }
  }

  function removeScene() {
    if (Object.keys(scenes).length <= 1) return;
    delete scenes[currentSceneName];
    switchScene(Object.keys(scenes)[0]);
  }

  function renameScenePrompt() {
    const newName = prompt("Rename Scene:", currentSceneName);
    if (newName && newName !== currentSceneName && !scenes[newName]) {
      scenes[newName] = scenes[currentSceneName];
      delete scenes[currentSceneName];
      switchScene(newName);
    }
  }

  function removeActiveSource() {
    if (!activeSource) return;
    if (activeSource.element && activeSource.element.pause) activeSource.element.pause();
    scenes[currentSceneName] = scenes[currentSceneName].filter(s => s !== activeSource);
    activeSource = null;
    hideMediaToolbar();
    renderSourcesUI();
  }

  function moveLayerUp() {
    if (!activeSource) return;
    const arr = scenes[currentSceneName];
    const idx = arr.indexOf(activeSource);
    if (idx < arr.length - 1) {
      arr[idx] = arr[idx + 1];
      arr[idx + 1] = activeSource;
      renderSourcesUI();
    }
  }

  function moveLayerDown() {
    if (!activeSource) return;
    const arr = scenes[currentSceneName];
    const idx = arr.indexOf(activeSource);
    if (idx > 0) {
      arr[idx] = arr[idx - 1];
      arr[idx - 1] = activeSource;
      renderSourcesUI();
    }
  }

  /* ------------------------------------------------------------
     Source Add Handlers
     ------------------------------------------------------------ */
  function triggerPick(type) {
    closeModal("sourceModal");
    if (type === "image") document.getElementById("pickImgFile").click();
    if (type === "video") document.getElementById("pickVidFile").click();
  }

  function onFileImgSelected(e) {
    const file = e.target.files[0];
    if (!file) return;
    const img = new Image();
    img.src = URL.createObjectURL(file);
    img.onload = () => {
      // Skala awal gambar otomatis proporsional di tengah kanvas
      const w = 640;
      const h = Math.round((img.naturalHeight / img.naturalWidth) * 640) || 360;
      const srcObj = {
        name: "🖼️ " + file.name,
        type: "image",
        element: img,
        x: Math.round((1280 - w) / 2),
        y: Math.round((720 - h) / 2),
        w: w, h: h,
        visible: true
      };
      scenes[currentSceneName].push(srcObj);
      selectSource(srcObj);
    };
  }

  function onFileVidSelected(e) {
    const file = e.target.files[0];
    if (!file) return;
    const vid = document.createElement("video");
    vid.src = URL.createObjectURL(file);
    vid.autoplay = true;
    vid.loop = true;
    vid.muted = true;
    vid.playsInline = true;
    vid.play();

    vid.onloadedmetadata = () => {
      const w = 854;
      const h = Math.round((vid.videoHeight / vid.videoWidth) * 854) || 480;
      const srcObj = {
        name: "🎬 " + file.name,
        type: "video",
        element: vid,
        x: Math.round((1280 - w) / 2),
        y: Math.round((720 - h) / 2),
        w: w, h: h,
        visible: true
      };
      scenes[currentSceneName].push(srcObj);
      selectSource(srcObj);
    };
  }

  function initCamDevice(facing) {
    closeModal("sourceModal");
    navigator.mediaDevices.getUserMedia({ video: { facingMode: facing }, audio: true })
      .then(stream => {
        const vid = document.createElement("video");
        vid.autoplay = true;
        vid.muted = true;
        vid.playsInline = true;
        vid.srcObject = stream;
        vid.play();

        const srcObj = {
          name: facing === "user" ? "🤳 Front Camera" : "📹 Rear Camera",
          type: "camera",
          element: vid,
          x: 160, y: 90, w: 960, h: 540,
          visible: true
        };
        scenes[currentSceneName].push(srcObj);
        selectSource(srcObj);
      })
      .catch(err => alert("Kamera error: " + err.message));
  }

  function addDroneStream() {
    closeModal("sourceModal");
    const u = prompt("RTSP Drone URL:", "rtsp://192.168.1.1:8554/live");
    if (!u) return;
    const srcObj = {
      name: "🛸 " + u,
      type: "drone",
      x: 160, y: 90, w: 960, h: 540,
      visible: true
    };
    scenes[currentSceneName].push(srcObj);
    selectSource(srcObj);
  }

  function addTextGDI() {
    closeModal("sourceModal");
    const t = prompt("Overlay Text:", "LIVE STREAM");
    if (!t) return;
    const srcObj = {
      name: "📝 " + t,
      type: "text",
      text: t,
      x: 100, y: 600, w: 600, h: 60,
      visible: true
    };
    scenes[currentSceneName].push(srcObj);
    selectSource(srcObj);
  }

  function addColorBg() {
    closeModal("sourceModal");
    const srcObj = {
      name: "⬛ Color Source",
      type: "color",
      color: "#2563eb",
      x: 100, y: 100, w: 500, h: 300,
      visible: true
    };
    scenes[currentSceneName].push(srcObj);
    selectSource(srcObj);
  }

  /* ------------------------------------------------------------
     Media Playback Controls Bar
     ------------------------------------------------------------ */
  let currMediaVid = null;

  function showMediaToolbar(vid) {
    currMediaVid = vid;
    document.getElementById("mediaToolbar").style.display = "flex";
    vid.ontimeupdate = () => {
      if (!vid.duration) return;
      const pct = (vid.currentTime / vid.duration) * 100;
      document.getElementById("mSeekbar").value = pct;
      document.getElementById("mTimeLabel").innerText = formatTimeSec(vid.currentTime) + " / " + formatTimeSec(vid.duration);
    };
  }

  function hideMediaToolbar() {
    document.getElementById("mediaToolbar").style.display = "none";
    currMediaVid = null;
  }

  function togglePlayMedia() {
    if (!currMediaVid) return;
    const btn = document.getElementById("mPlayBtn");
    if (currMediaVid.paused) {
      currMediaVid.play();
      btn.innerText = "⏸";
    } else {
      currMediaVid.pause();
      btn.innerText = "▶";
    }
  }

  function stopMedia() {
    if (!currMediaVid) return;
    currMediaVid.pause();
    currMediaVid.currentTime = 0;
    document.getElementById("mPlayBtn").innerText = "▶";
  }

  function restartMedia() {
    if (!currMediaVid) return;
    currMediaVid.currentTime = 0;
    currMediaVid.play();
    document.getElementById("mPlayBtn").innerText = "⏸";
  }

  function onSeekMedia(val) {
    if (!currMediaVid || !currMediaVid.duration) return;
    currMediaVid.currentTime = (val / 100) * currMediaVid.duration;
  }

  function formatTimeSec(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return "00:" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  }

  /* ------------------------------------------------------------
     Studio Mode Dual Monitor (Proporsional 16:9 Otomatis)
     ------------------------------------------------------------ */
  function toggleStudioMode() {
    isStudioMode = !isStudioMode;
    const progBox = document.getElementById("programMonitor");
    const trans = document.getElementById("transBar");
    const btn = document.getElementById("btnStudio");

    if (isStudioMode) {
      progBox.style.display = "flex";
      trans.style.display = "flex";
      btn.style.background = "#5865f2";
      btn.style.color = "#fff";
      execTransition('cut');
    } else {
      progBox.style.display = "none";
      trans.style.display = "none";
      btn.style.background = "";
      btn.style.color = "";
    }
  }

  function execTransition(type) {
    const currentList = scenes[currentSceneName] || [];
    programSceneSources = currentList.map(item => ({ ...item }));

    if (type === "fade") {
      gCanvas.style.transition = "opacity 0.2s ease-out";
      gCanvas.style.opacity = "0.2";
      setTimeout(() => { gCanvas.style.opacity = "1"; }, 100);
    }
  }

  /* ------------------------------------------------------------
     Streaming & Recording Logic
     ------------------------------------------------------------ */
  function pad2(n) { return String(n).padStart(2, "0"); }
  function fmtTimer(s) { return pad2(Math.floor(s/3600)) + ":" + pad2(Math.floor((s%3600)/60)) + ":" + pad2(s%60); }

  
  let whipPeerConnection = null;

  async function pushCanvasViaWhip() {
    try {
      const targetCanvas = isStudioMode ? document.getElementById("programCanvas") : document.getElementById("previewCanvas");
      const stream = targetCanvas.captureStream(30);

      if (window.micAudioStream) {
        window.micAudioStream.getAudioTracks().forEach(track => stream.addTrack(track));
      }

      whipPeerConnection = new RTCPeerConnection({
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
      });

      stream.getTracks().forEach(track => whipPeerConnection.addTrack(track, stream));

      const offer = await whipPeerConnection.createOffer();
      await whipPeerConnection.setLocalDescription(offer);

      // Kirim SDP Offer ke MediaMTX WHEP/WHIP lokal
      fetch("http://127.0.0.1:8889/live/whip", {
        method: "POST",
        headers: { "Content-Type": "application/sdp" },
        body: offer.sdp
      }).then(res => res.text()).then(answerSdp => {
        whipPeerConnection.setRemoteDescription(new RTCSessionDescription({
          type: "answer",
          sdp: answerSdp
        }));
      }).catch(err => console.log("WHIP connect notice:", err));
    } catch (e) {
      console.error("WHIP Error:", e);
    }
  }

  function stopWhipStream() {
    if (whipPeerConnection) {
      whipPeerConnection.close();
      whipPeerConnection = null;
    }
  }

  function toggleStream() {
    const btn = document.getElementById("btnStream");
    if (!isStreaming) {
      const sKey = localStorage.getItem("obs_key");
      const sUrl = localStorage.getItem("obs_server") || "rtmps://live-api-s.facebook.com:443/rtmp/";
      if (!sKey) {
        openSettingsModal();
        alert("Silakan masukkan Stream Key Facebook di Settings terlebih dahulu!");
        return;
      }

      isStreaming = true;
      btn.innerText = "Stop Streaming";
      btn.classList.add("obs-live-on");
      liveSeconds = 0;
      liveTimer = setInterval(() => {
        liveSeconds++;
        document.getElementById("lblLive").innerText = "● LIVE: " + fmtTimer(liveSeconds);
        document.getElementById("lblKbit").innerText = "Kbit/s: " + (3300 + Math.floor(Math.random()*300));
      }, 1000);

      if (window.AndroidBridge && window.AndroidBridge.startStreamToFacebook) {
        window.AndroidBridge.startStreamToFacebook(sUrl, sKey);
      }
      pushCanvasViaWhip();
    } else {
      isStreaming = false;
      btn.innerText = "Start Streaming";
      btn.classList.remove("obs-live-on");
      clearInterval(liveTimer);
      if (window.AndroidBridge && window.AndroidBridge.stopStream) {
        window.AndroidBridge.stopStream();
      }
      stopWhipStream();
    }
  }

  function toggleRecord() {
    const btn = document.getElementById("btnRecord");
    if (!isRecording) {
      isRecording = true;
      btn.innerText = "Stop Recording";
      btn.classList.add("obs-rec-on");
      recSeconds = 0;
      recTimer = setInterval(() => {
        recSeconds++;
        document.getElementById("lblRec").innerText = "● REC: " + fmtTimer(recSeconds);
      }, 1000);
    } else {
      isRecording = false;
      btn.innerText = "Start Recording";
      btn.classList.remove("obs-rec-on");
      clearInterval(recTimer);
    }
  }

  /* ------------------------------------------------------------
     Audio Meter & Realtime VU Bar
     ------------------------------------------------------------ */
  function setMicVolume(v) { micVolume = v / 100; }

  function initAudioMeter() {
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      window.micAudioStream = stream;
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 64;
      const source = audioCtx.createMediaStreamSource(stream);
      source.connect(analyser);

      const data = new Uint8Array(analyser.frequencyBinCount);
      const vu = document.getElementById("vuMeterBar");
      const dbLabel = document.getElementById("dbNumLabel");

      function updateMeter() {
        requestAnimationFrame(updateMeter);
        analyser.getByteFrequencyData(data);
        let sum = 0;
        for (let i = 0; i < data.length; i++) sum += data[i];
        let avg = (sum / data.length) * micVolume;

        let pct = Math.min(100, Math.round((avg / 128) * 100));
        vu.style.width = pct + "%";

        let db = avg > 0 ? (Math.round((avg / 255) * 50) - 50) : -60;
        dbLabel.innerText = db + " dB";
        dbLabel.style.color = db > -5 ? "#ef4444" : (db > -18 ? "#eab308" : "#22c55e");
      }
      updateMeter();
    }).catch(e => console.log("Audio meter notice:", e.message));
  }

  window.addEventListener("DOMContentLoaded", () => {
    renderScenesUI();
    renderSourcesUI();
    setTimeout(initAudioMeter, 1000);
  });
</script>
