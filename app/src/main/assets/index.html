<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebOBS Control</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: #0f172a; color: #f8fafc; padding: 16px; }
        h1 { font-size: 20px; margin-bottom: 12px; color: #38bdf8; text-align: center; }
        .card { background: #1e293b; padding: 16px; border-radius: 12px; margin-bottom: 16px; border: 1px solid #334155; }
        .btn { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 8px; }
        .status { padding: 8px; background: #064e3b; color: #34d399; border-radius: 6px; text-align: center; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>WebOBS Studio Standalone</h1>
    <div class="card">
        <p>Aplikasi berjalan mandiri tanpa Termux dan tanpa server lokal.</p>
        <div class="status">Sistem Siap Digunakan</div>
        <button class="btn" onclick="alert('WebOBS Control Aktif!')">Mulai Kontrol</button>
    </div>
</body>
</html>
