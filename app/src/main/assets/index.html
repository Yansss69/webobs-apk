<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OBS Studio Native Mobile</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100vw; height: 100vh; overflow: hidden; background: #14151b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #dcddde; user-select: none; }
    #app { display: flex; flex-direction: column; width: 100vw; height: 100vh; }

    /* Top Menu Bar */
    .topbar { height: 26px; background: #1f2029; display: flex; align-items: center; padding: 0 10px; font-size: 11px; gap: 14px; border-bottom: 1px solid #2d2f3d; flex-shrink: 0; }
    .topbar span { cursor: pointer; color: #b9bbbe; }
    .topbar span:hover { color: #fff; }

    /* Monitor Viewport */
    .viewport-area { flex: 1; display: flex; flex-direction: column; background: #0b0c10; position: relative; overflow: hidden; padding: 4px; gap: 4px; }
    .monitors-wrap { flex: 1; display: flex; width: 100%; height: 100%; gap: 6px; position: relative; }
    
    .monitor-box { flex: 1; height: 100%; display: flex; flex-direction: column; background: #000; position: relative; }
    .monitor-header { height: 18px; font-size: 9px; font-weight: bold; letter-spacing: 1px; display: flex; align-items: center; padding: 0 6px; justify-content: space-between; flex-shrink: 0; }
    .preview-header { background: #1e3a8a; color: #93c5fd; }
    .program-header { background: #7f1d1d; color: #fca5a5; }

    .stage-canvas { flex: 1; width: 100%; height: 100%; position: relative; overflow: hidden; background: #0d0e12; touch-action: none; }

    /* OBS 8-Point Bounding Box */
    .obs-bbox { position: absolute; border: 2px solid #ef4444; touch-action: none; }
    .obs-bbox.selected { border-color: #ef4444; }
    .obs-handle { position: absolute; width: 10px; height: 10px; background: #ffffff; border: 2px solid #ef4444; border-radius: 2px; }
    .h-tl { left: -5px; top: -5px; cursor: nw-resize; }
    .h-tr { right: -5px; top: -5px; cursor: ne-resize; }
    .h-bl { left: -5px; bottom: -5px; cursor: sw-resize; }
    .h-br { right: -5px; bottom: -5px; cursor: se-resize; }
    .h-tm { left: calc(50% - 5px); top: -5px; cursor: n-resize; }
    .h-bm { left: calc(50% - 5px); bottom: -5px; cursor: s-resize; }
    .h-ml { left: -5px; top: calc(50% - 5px); cursor: w-resize; }
    .h-mr { right: -5px; top: calc(50% - 5px); cursor: e-resize; }

    /* Transition Bar */
    .trans-bar { width: 75px; display: none; flex-direction: column; justify-content: center; gap: 8px; align-items: center; flex-shrink: 0; }
    .trans-btn { width: 100%; background: #272936; border: 1px solid #3c3f52; color: #fff; font-size: 10px; font-weight: bold; padding: 8px 2px; border-radius: 4px; cursor: pointer; }
    .trans-btn:active { background: #5865f2; }

    /* Media Playback Toolbar (Play/Pause/Seekbar) */
    .media-toolbar { height: 26px; background: #161720; border: 1px solid #2d2f3d; display: none; align-items: center; padding: 0 8px; gap: 8px; font-size: 11px; flex-shrink: 0; }
    .media-btn { background: transparent; border: none; color: #dcddde; cursor: pointer; font-size: 12px; }
    .media-progress { flex: 1; accent-color: #5865f2; height: 4px; }
    .media-time { font-size: 10px; color: #8e9297; font-family: monospace; }

    /* Bottom Control Docks */
    .dock-area { height: 130px; background: #1a1b24; border-top: 1px solid #2d2f3d; display: flex; flex-shrink: 0; }
    .dock-col { border-right: 1px solid #2d2f3d; display: flex; flex-direction: column; }
    .dock-title { font-size: 9px; font-weight: bold; padding: 4px 8px; background: #161720; color: #8e9297; text-transform: uppercase; border-bottom: 1px solid #262836; display: flex; justify-content: space-between; }
    .dock-list { flex: 1; overflow-y: auto; padding: 4px; display: flex; flex-direction: column; gap: 2px; }
    .dock-actions { height: 26px; background: #161720; display: flex; align-items: center; gap: 4px; padding: 0 6px; border-top: 1px solid #262836; }
    .dock-btn { background: #282a3a; border: 1px solid #3a3d52; color: #dcddde; min-width: 22px; height: 20px; font-size: 11px; border-radius: 3px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .dock-btn:active { background: #5865f2; color: #fff; }

    .list-item { font-size: 11px; padding: 4px 6px; border-radius: 3px; background: #232533; color: #dcddde; cursor: pointer; }
    .list-item.active { background: #5865f2; color: #fff; font-weight: bold; }

    /* Controls Panel */
    .ctrl-col { width: 130px; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
    .ctrl-btn { flex: 1; background: #262837; border: 1px solid #383b50; color: #dcddde; font-size: 11px; border-radius: 3px; cursor: pointer; font-weight: 500; }
    .ctrl-btn:active { background: #40445a; }
    .live-active { background: #ed4245 !important; color: #fff !important; font-weight: bold; }
    .rec-active { background: #ed4245 !important; color: #fff !important; font-weight: bold; }

    /* Status Bar */
    .statusbar { height: 20px; background: #111217; display: flex; align-items: center; padding: 0 8px; font-size: 10px; color: #72767d; gap: 14px; border-top: 1px solid #22232e; flex-shrink: 0; }

    /* Modals */
    .modal-wrap { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 9999; align-items: center; justify-content: center; }
    .modal-box { background: #20212b; border: 1px solid #303242; border-radius: 6px; width: 340px; max-height: 85vh; overflow-y: auto; padding: 14px; color: #dcddde; }
    .modal-head { font-size: 12px; font-weight: bold; border-bottom: 1px solid #303242; padding-bottom: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; }
    .src-opt { background: #282a3a; border: 1px solid #3a3d52; color: #fff; padding: 8px 10px; border-radius: 4px; text-align: left; font-size: 11px; cursor: pointer; margin-bottom: 5px; width: 100%; }
    .src-opt:active { background: #5865f2; }
    .form-row { margin-bottom: 8px; display: flex; flex-direction: column; gap: 3px; }
    .form-row label { font-size: 10px; color: #8e9297; }
    .form-row input, .form-row select { background: #161720; border: 1px solid #303242; color: #fff; padding: 5px; border-radius: 3px; font-size: 11px; outline: none; }
  </style>
</head>
<body>
<div id="app">
  <!-- Topbar -->
  <div class="topbar">
    <span>File</span><span>Edit</span><span>View</span><span>Profile</span><span>Scene Collection</span><span>Tools</span><span>Help</span>
  </div>

  <!-- Viewport Area -->
  <div class="viewport-area">
    <div class="monitors-wrap" id="monitorsWrap">
      <!-- Preview Monitor -->
      <div class="monitor-box" id="previewMonitorBox" style="border: 1px solid #2563eb;">
        <div class="monitor-header preview-header" id="previewHeader"><span>PREVIEW</span><span>WORKSPACE</span></div>
        <div class="stage-canvas" id="previewStage"></div>
      </div>
      <!-- Center Transition Bar -->
      <div class="trans-bar" id="transBar">
        <button class="trans-btn" onclick="execTransition('cut')">CUT</button>
        <button class="trans-btn" onclick="execTransition('fade')" style="background:#2563eb;">TRANSITION</button>
      </div>
      <!-- Program Monitor -->
      <div class="monitor-box" id="programMonitorBox" style="display:none; border: 1px solid #dc2626;">
        <div class="monitor-header program-header"><span>PROGRAM</span><span>LIVE ON AIR</span></div>
        <div class="stage-canvas" id="programStage"></div>
      </div>
    </div>

    <!-- Media Controls Toolbar -->
    <div class="media-toolbar" id="mediaToolbar">
      <button class="media-btn" id="mediaPlayBtn" onclick="toggleMediaPlay()">⏸</button>
      <button class="media-btn" onclick="stopActiveMedia()">⏹</button>
      <input type="range" class="media-progress" id="mediaProgress" min="0" max="100" value="0" oninput="seekActiveMedia(this.value)">
      <span class="media-time" id="mediaTimeLabel">00:00 / 00:00</span>
    </div>
  </div>

  <!-- Bottom Docks Area -->
  <div class="dock-area">
    <!-- Scenes -->
    <div class="dock-col" style="width: 140px;">
      <div class="dock-title">Scenes</div>
      <div class="dock-list" id="scenesList"></div>
      <div class="dock-actions">
        <button class="dock-btn" onclick="promptAddScene()">+</button>
        <button class="dock-btn" onclick="removeActiveScene()">-</button>
      </div>
    </div>
    <!-- Sources -->
    <div class="dock-col" style="width: 180px;">
      <div class="dock-title">Sources</div>
      <div class="dock-list" id="sourcesList"></div>
      <div class="dock-actions">
        <button class="dock-btn" onclick="openSourcesModal()">+</button>
        <button class="dock-btn" onclick="removeActiveSource()">-</button>
      </div>
    </div>
    <!-- Audio Mixer -->
    <div class="dock-col" style="flex: 1;">
      <div class="dock-title"><span>Audio Mixer</span><span style="color:#3ba55c; font-size:8px;">REAL-TIME</span></div>
      <div style="padding: 10px; display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; justify-content: space-between; font-size: 11px;">
          <span>Mic/Aux</span>
          <span id="dbDisplay" style="color: #3ba55c;">-60 dB</span>
        </div>
        <input type="range" id="micSlider" min="0" max="100" value="85" style="width: 100%; accent-color: #5865f2;">
      </div>
    </div>
    <!-- Transitions Dock -->
    <div class="dock-col" style="width: 130px;">
      <div class="dock-title">Transitions</div>
      <div style="padding: 8px; display: flex; flex-direction: column; gap: 6px;">
        <select style="background:#161720; border:1px solid #303242; color:#fff; font-size:10px; padding:3px;"><option>Fade</option><option>Cut</option></select>
        <input type="text" value="300 ms" style="background:#161720; border:1px solid #303242; color:#fff; font-size:10px; padding:3px;" />
      </div>
    </div>
    <!-- Controls Dock -->
    <div class="dock-col ctrl-col">
      <button class="ctrl-btn" id="btnStreaming" onclick="toggleStreaming()">Start Streaming</button>
      <button class="ctrl-btn" id="btnRecording" onclick="toggleRecording()">Start Recording</button>
      <button class="ctrl-btn" id="btnStudioMode" onclick="toggleStudioMode()">Studio Mode</button>
      <button class="ctrl-btn" onclick="openSettingsModal()">Settings</button>
    </div>
  </div>

  <!-- Status Bar -->
  <div class="statusbar">
    <span id="statusLive">• LIVE: 00:00:00</span>
    <span id="statusRec">• REC: 00:00:00</span>
    <span>CPU: 0.0%, 60.00 fps</span>
    <span id="statusKbit">Kbit/s: 0</span>
  </div>
</div>

<!-- Input Files Picker -->
<input type="file" id="pickerGalleryImage" accept="image/*" style="display:none;" onchange="handleImageFile(event)" />
<input type="file" id="pickerGalleryVideo" accept="video/*" style="display:none;" onchange="handleVideoFile(event)" />

<!-- Modal Sources -->
<div id="sourcesModal" class="modal-wrap">
  <div class="modal-box">
    <div class="modal-head"><span>Add Source</span><span style="cursor:pointer;" onclick="closeModal('sourcesModal')">✕</span></div>
    <button class="src-opt" onclick="triggerPicker('image')">🖼️ Image (Buka Galeri Foto)</button>
    <button class="src-opt" onclick="triggerPicker('video')">🎬 Media Source (Buka Galeri Video)</button>
    <button class="src-opt" onclick="startCamera('environment')">📹 Video Capture (Kamera Belakang)</button>
    <button class="src-opt" onclick="startCamera('user')">🤳 Video Capture (Kamera Depan)</button>
    <button class="src-opt" onclick="addDroneRTSP()">🛸 Drone Stream (RTSP / RTMP)</button>
    <button class="src-opt" onclick="addTextSource()">📝 Text Overlay (GDI+)</button>
    <button class="src-opt" onclick="addColorSource()">⬛ Color Source</button>
  </div>
</div>

<!-- Modal Settings -->
<div id="settingsModal" class="modal-wrap">
  <div class="modal-box">
    <div class="modal-head"><span>OBS Settings</span><span style="cursor:pointer;" onclick="closeModal('settingsModal')">✕</span></div>
    <div class="form-row"><label>Platform</label><select id="cfgService"><option>Facebook Live</option><option>Custom RTMP</option><option>YouTube Live</option></select></div>
    <div class="form-row"><label>Server URL</label><input type="text" id="cfgRtmp" value="rtmps://live-api-s.facebook.com:443/rtmp/" /></div>
    <div class="form-row"><label>Stream Key</label><input type="password" id="cfgKey" placeholder="Paste Stream Key disini..." /></div>
    <div style="display:flex; gap:8px;">
      <div class="form-row" style="flex:1;"><label>Bitrate</label><input type="text" id="cfgBitrate" value="3500k" /></div>
      <div class="form-row" style="flex:1;"><label>FPS</label><select id="cfgFps"><option>30 FPS</option><option>60 FPS</option></select></div>
    </div>
    <button class="src-opt" style="background:#5865f2; text-align:center; margin-top:8px;" onclick="saveSettings()">Save & Apply</button>
  </div>
</div>

<script>
  let isStudio = false;
  let isStreaming = false;
  let isRecording = false;
  let liveSec = 0, recSec = 0;
  let liveTimer = null, recTimer = null;
  let activeScene = "Scene 1";
  let activeItemObj = null;

  // Scene Data Structure
  let scenesData = {
    "Scene 1": []
  };

  function closeModal(id) { document.getElementById(id).style.display = "none"; }
  function openSourcesModal() { document.getElementById("sourcesModal").style.display = "flex"; }
  function openSettingsModal() {
    document.getElementById("cfgKey").value = localStorage.getItem("obs_key") || "";
    document.getElementById("cfgRtmp").value = localStorage.getItem("obs_rtmp") || "rtmps://live-api-s.facebook.com:443/rtmp/";
    document.getElementById("settingsModal").style.display = "flex";
  }
  function saveSettings() {
    localStorage.setItem("obs_key", document.getElementById("cfgKey").value);
    localStorage.setItem("obs_rtmp", document.getElementById("cfgRtmp").value);
    closeModal("settingsModal");
  }

  /* Scenes & Sources UI */
  function renderScenes() {
    const list = document.getElementById("scenesList");
    list.innerHTML = "";
    Object.keys(scenesData).forEach(name => {
      const item = document.createElement("div");
      item.className = "list-item" + (name === activeScene ? " active" : "");
      item.innerText = name;
      item.onclick = () => switchScene(name);
      list.appendChild(item);
    });
  }

  function renderSourcesList() {
    const list = document.getElementById("sourcesList");
    list.innerHTML = "";
    const items = scenesData[activeScene] || [];
    items.forEach((item) => {
      const row = document.createElement("div");
      row.className = "list-item" + (item === activeItemObj ? " active" : "");
      row.innerText = item.name;
      row.onclick = () => selectSourceItem(item);
      list.appendChild(row);
    });
  }

  function switchScene(name) {
    activeScene = name;
    renderScenes();
    const stage = document.getElementById("previewStage");
    stage.innerHTML = "";
    activeItemObj = null;
    hideMediaToolbar();

    if (scenesData[name]) {
      scenesData[name].forEach(item => {
        stage.appendChild(item.box);
        attach8PointTransform(item.box, item);
      });
    }
    renderSourcesList();
  }

  function promptAddScene() {
    const name = prompt("Nama Scene Baru:", "Scene " + (Object.keys(scenesData).length + 1));
    if (name && !scenesData[name]) {
      scenesData[name] = [];
      switchScene(name);
    }
  }

  function removeActiveScene() {
    const keys = Object.keys(scenesData);
    if (keys.length <= 1) return;
    delete scenesData[activeScene];
    switchScene(Object.keys(scenesData)[0]);
  }

  function selectSourceItem(itemObj) {
    activeItemObj = itemObj;
    document.querySelectorAll(".obs-bbox").forEach(b => {
      b.style.borderColor = "transparent";
      b.querySelectorAll(".obs-handle").forEach(h => h.style.display = "none");
    });

    if (itemObj && itemObj.box) {
      itemObj.box.style.borderColor = "#ef4444";
      itemObj.box.querySelectorAll(".obs-handle").forEach(h => h.style.display = "block");

      // Jika item adalah video galeri, tampilkan media toolbar
      if (itemObj.type === "video") {
        showMediaToolbar(itemObj.mediaEl);
      } else {
        hideMediaToolbar();
      }
    } else {
      hideMediaToolbar();
    }
    renderSourcesList();
  }

  function removeActiveSource() {
    if (!activeItemObj) return;
    if (activeItemObj.mediaEl && activeItemObj.mediaEl.pause) activeItemObj.mediaEl.pause();
    activeItemObj.box.remove();
    scenesData[activeScene] = scenesData[activeScene].filter(s => s !== activeItemObj);
    activeItemObj = null;
    hideMediaToolbar();
    renderSourcesList();
  }

  /* 8-Point Bounding Box Transform (Drag & Scale Resize) */
  function attach8PointTransform(box, itemObj) {
    box.querySelectorAll(".obs-handle").forEach(h => h.remove());

    const handles = ["tl", "tr", "bl", "br", "tm", "bm", "ml", "mr"];
    handles.forEach(pos => {
      const h = document.createElement("div");
      h.className = "obs-handle h-" + pos;
      h.dataset.pos = pos;
      box.appendChild(h);
    });

    let isDrag = false, isResize = false, handleType = "";
    let sx, sy, sl, st, sw, sh;

    function down(e) {
      e.stopPropagation();
      selectSourceItem(itemObj);
      const p = e.touches ? e.touches[0] : e;
      sx = p.clientX; sy = p.clientY;
      sl = box.offsetLeft; st = box.offsetTop;
      sw = box.offsetWidth; sh = box.offsetHeight;

      if (e.target.classList.contains("obs-handle")) {
        isResize = true;
        handleType = e.target.dataset.pos;
      } else {
        isDrag = true;
      }
    }

    function move(e) {
      if (!isDrag && !isResize) return;
      const p = e.touches ? e.touches[0] : e;
      const dx = p.clientX - sx;
      const dy = p.clientY - sy;

      if (isDrag) {
        box.style.left = Math.max(0, sl + dx) + "px";
        box.style.top = Math.max(0, st + dy) + "px";
      } else if (isResize) {
        if (handleType === "br") {
          box.style.width = Math.max(40, sw + dx) + "px";
          box.style.height = Math.max(30, sh + dy) + "px";
        } else if (handleType === "bl") {
          box.style.left = (sl + dx) + "px";
          box.style.width = Math.max(40, sw - dx) + "px";
          box.style.height = Math.max(30, sh + dy) + "px";
        } else if (handleType === "tr") {
          box.style.top = (st + dy) + "px";
          box.style.width = Math.max(40, sw + dx) + "px";
          box.style.height = Math.max(30, sh - dy) + "px";
        } else if (handleType === "tl") {
          box.style.left = (sl + dx) + "px";
          box.style.top = (st + dy) + "px";
          box.style.width = Math.max(40, sw - dx) + "px";
          box.style.height = Math.max(30, sh - dy) + "px";
        } else if (handleType === "mr") {
          box.style.width = Math.max(40, sw + dx) + "px";
        } else if (handleType === "bm") {
          box.style.height = Math.max(30, sh + dy) + "px";
        }
      }
    }

    function up() { isDrag = false; isResize = false; }

    box.addEventListener("mousedown", down);
    box.addEventListener("touchstart", down, {passive:false});
    window.addEventListener("mousemove", move);
    window.addEventListener("touchmove", move, {passive:false});
    window.addEventListener("mouseup", up);
    window.addEventListener("touchend", up);
  }

  function createSourceBox(innerMedia, title, type, w, h) {
    const box = document.createElement("div");
    box.className = "obs-bbox";
    box.style.width = (w || 260) + "px";
    box.style.height = (h || 146) + "px";
    box.style.left = "20px";
    box.style.top = "20px";

    innerMedia.style.width = "100%";
    innerMedia.style.height = "100%";
    innerMedia.style.objectFit = "cover";
    innerMedia.style.pointerEvents = "none";
    box.appendChild(innerMedia);

    document.getElementById("previewStage").appendChild(box);

    const itemObj = { name: title, type: type, box: box, mediaEl: innerMedia };
    attach8PointTransform(box, itemObj);
    scenesData[activeScene].push(itemObj);

    selectSourceItem(itemObj);
  }

  /* Sources Action Handlers */
  function triggerPicker(type) {
    closeModal("sourcesModal");
    if (type === "image") document.getElementById("pickerGalleryImage").click();
    if (type === "video") document.getElementById("pickerGalleryVideo").click();
  }

  function handleImageFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const img = document.createElement("img");
    img.src = URL.createObjectURL(file);
    createSourceBox(img, "🖼️ " + file.name, "image", 220, 160);
  }

  function handleVideoFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const vid = document.createElement("video");
    vid.src = URL.createObjectURL(file);
    vid.autoplay = true;
    vid.loop = true;
    vid.muted = true;
    vid.playsInline = true;
    vid.play();

    createSourceBox(vid, "🎬 " + file.name, "video", 260, 146);
  }

  function startCamera(facing) {
    closeModal("sourcesModal");
    navigator.mediaDevices.getUserMedia({ video: { facingMode: facing }, audio: true })
      .then(stream => {
        const vid = document.createElement("video");
        vid.autoplay = true; vid.muted = true; vid.playsInline = true;
        vid.srcObject = stream;
        vid.play();
        createSourceBox(vid, facing === "user" ? "🤳 Front Camera" : "📹 Rear Camera", "camera", 260, 146);
      })
      .catch(err => alert("Kamera error: " + err.message));
  }

  function addDroneRTSP() {
    closeModal("sourcesModal");
    const u = prompt("RTSP Drone Stream URL:", "rtsp://192.168.1.1:8554/live");
    if (!u) return;
    const box = document.createElement("div");
    box.style.background = "#1f2937"; box.style.color = "#60a5fa"; box.style.display = "flex";
    box.style.alignItems = "center"; box.style.justifyContent = "center"; box.style.fontSize = "12px";
    box.innerText = "🛸 DRONE LIVE STREAM";
    createSourceBox(box, "🛸 " + u, "drone", 260, 146);
  }

  function addTextSource() {
    closeModal("sourcesModal");
    const txt = prompt("Overlay Text:", "LIVE STREAM");
    if (!txt) return;
    const d = document.createElement("div");
    d.style.color = "#fff"; d.style.fontWeight = "bold"; d.style.fontSize = "18px";
    d.style.textShadow = "2px 2px 4px #000"; d.innerText = txt;
    createSourceBox(d, "📝 " + txt, "text", 200, 40);
  }

  function addColorSource() {
    closeModal("sourcesModal");
    const d = document.createElement("div");
    d.style.background = "#2563eb";
    createSourceBox(d, "⬛ Color Source", "color", 180, 100);
  }

  /* Media Toolbar Controls */
  let activeVideoEl = null;

  function showMediaToolbar(videoEl) {
    activeVideoEl = videoEl;
    const bar = document.getElementById("mediaToolbar");
    bar.style.display = "flex";

    videoEl.ontimeupdate = () => {
      if (!videoEl.duration) return;
      const prog = (videoEl.currentTime / videoEl.duration) * 100;
      document.getElementById("mediaProgress").value = prog;
      document.getElementById("mediaTimeLabel").innerText = fmtFltTime(videoEl.currentTime) + " / " + fmtFltTime(videoEl.duration);
    };
  }

  function hideMediaToolbar() {
    document.getElementById("mediaToolbar").style.display = "none";
    activeVideoEl = null;
  }

  function toggleMediaPlay() {
    if (!activeVideoEl) return;
    const btn = document.getElementById("mediaPlayBtn");
    if (activeVideoEl.paused) {
      activeVideoEl.play();
      btn.innerText = "⏸";
    } else {
      activeVideoEl.pause();
      btn.innerText = "▶";
    }
  }

  function stopActiveMedia() {
    if (!activeVideoEl) return;
    activeVideoEl.pause();
    activeVideoEl.currentTime = 0;
    document.getElementById("mediaPlayBtn").innerText = "▶";
  }

  function seekActiveMedia(val) {
    if (!activeVideoEl || !activeVideoEl.duration) return;
    activeVideoEl.currentTime = (val / 100) * activeVideoEl.duration;
  }

  function fmtFltTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  }

  /* Studio Mode Dual Screen & Transition Fix */
  function toggleStudioMode() {
    isStudio = !isStudio;
    const trans = document.getElementById("transBar");
    const program = document.getElementById("programMonitorBox");
    const btn = document.getElementById("btnStudioMode");

    if (isStudio) {
      trans.style.display = "flex";
      program.style.display = "flex";
      btn.style.background = "#5865f2";
      btn.style.color = "#fff";
      execTransition('cut');
    } else {
      trans.style.display = "none";
      program.style.display = "none";
      btn.style.background = "";
      btn.style.color = "";
    }
  }

  function execTransition(type) {
    const previewStage = document.getElementById("previewStage");
    const programStage = document.getElementById("programStage");
    if (!previewStage || !programStage) return;

    if (type === "fade") {
      programStage.style.transition = "opacity 0.2s";
      programStage.style.opacity = "0.2";
      setTimeout(() => {
        syncProgramStage(previewStage, programStage);
        programStage.style.opacity = "1";
      }, 150);
    } else {
      syncProgramStage(previewStage, programStage);
    }
  }

  // Clone elemen Preview ke Program dan pastikan stream/video terus bergerak (tidak freeze)
  function syncProgramStage(src, dest) {
    dest.innerHTML = "";

    const items = src.querySelectorAll(".obs-bbox");
    items.forEach(item => {
      const clone = item.cloneNode(true);
      clone.style.border = "none";
      clone.style.boxShadow = "none";
      clone.querySelectorAll(".obs-handle").forEach(h => h.remove());

      // Sambungkan kembali stream video / camera
      const originalVideo = item.querySelector("video");
      const clonedVideo = clone.querySelector("video");

      if (originalVideo && clonedVideo) {
        if (originalVideo.srcObject) {
          clonedVideo.srcObject = originalVideo.srcObject;
        } else if (originalVideo.src) {
          clonedVideo.src = originalVideo.src;
          clonedVideo.currentTime = originalVideo.currentTime;
        }
        clonedVideo.autoplay = true;
        clonedVideo.muted = true;
        clonedVideo.playsInline = true;
        clonedVideo.play().catch(() => {});
      }

      dest.appendChild(clone);
    });
  }

  /* Streaming & Recording Logic */
  function pad(n) { return String(n).padStart(2, "0"); }
  function fmtTime(s) { return pad(Math.floor(s/3600)) + ":" + pad(Math.floor((s%3600)/60)) + ":" + pad(s%60); }

  function toggleStreaming() {
    const btn = document.getElementById("btnStreaming");
    if (!isStreaming) {
      isStreaming = true;
      btn.innerText = "Stop Streaming";
      btn.classList.add("live-active");
      liveSec = 0;
      liveTimer = setInterval(() => {
        liveSec++;
        document.getElementById("statusLive").innerText = "• LIVE: " + fmtTime(liveSec);
        document.getElementById("statusKbit").innerText = "Kbit/s: " + (3200 + Math.floor(Math.random()*400));
      }, 1000);
    } else {
      isStreaming = false;
      btn.innerText = "Start Streaming";
      btn.classList.remove("live-active");
      clearInterval(liveTimer);
    }
  }

  function toggleRecording() {
    const btn = document.getElementById("btnRecording");
    if (!isRecording) {
      isRecording = true;
      btn.innerText = "Stop Recording";
      btn.classList.add("rec-active");
      recSec = 0;
      recTimer = setInterval(() => {
        recSec++;
        document.getElementById("statusRec").innerText = "• REC: " + fmtTime(recSec);
      }, 1000);
    } else {
      isRecording = false;
      btn.innerText = "Start Recording";
      btn.classList.remove("rec-active");
      clearInterval(recTimer);
    }
  }

  /* Audio Meter dB */
  function initAudio() {
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 32;
      ctx.createMediaStreamSource(stream).connect(analyser);
      const data = new Uint8Array(analyser.frequencyBinCount);
      function draw() {
        requestAnimationFrame(draw);
        analyser.getByteFrequencyData(data);
        let sum = 0;
        for (let i = 0; i < data.length; i++) sum += data[i];
        let avg = sum / data.length;
        let db = avg > 0 ? (Math.round((avg / 255) * 45) - 45) : -60;
        const disp = document.getElementById("dbDisplay");
        disp.innerText = db + " dB";
        disp.style.color = db > -6 ? "#ed4245" : (db > -18 ? "#faa61a" : "#3ba55c");
      }
      draw();
    }).catch(e => console.log("Audio info:", e.message));
  }

  window.addEventListener("DOMContentLoaded", () => {
    renderScenes();
    setTimeout(initAudio, 1000);
  });
</script>
</body>
